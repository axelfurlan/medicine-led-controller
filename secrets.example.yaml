# Copy this file to secrets.yaml and fill in your own values.
# secrets.yaml is git-ignored; the configurator can also write it for you.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
ota_password: "YOUR_OTA_PASSWORD"
adafruit_io_key: "YOUR_ADAFRUIT_IO_KEY"
# ESPHome API encryption key (32 random bytes, base64); the configurator generates it when this is empty:
api_encryption_key: "YOUR_API_ENCRYPTION_KEY"
# Password of the fallback Wi-Fi hotspot (8-63 characters); the configurator generates it when this is empty:
ap_password: "YOUR_HOTSPOT_PASSWORD"
# Only for remote firmware updates (read-only fine-grained token of your private firmware repo):
github_token: "YOUR_GITHUB_TOKEN"
